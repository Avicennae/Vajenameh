[package]
name = "dehkhoda-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "لغت‌نامهٔ دهخدا — برنامهٔ دسکتاپ آفلاین"

[lib]
name = "dehkhoda_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# نسخه‌ها عمداً قفل شده‌اند (قدیمی‌تر از دو هفته و هم‌خانوادهٔ @tauri-apps/api در package.json)
tauri = { version = "=2.12.5", features = [] }
# پنجرهٔ بومی «انتخاب پوشه» برای همگام‌سازی. فقط از سمت Rust صدا زده می‌شود؛ هیچ مجوزی از این افزونه
# (dialog:*) به رابط داده نشده است (capabilities/default.json). نسخه‌ها قدیمی‌تر از دو هفته و بدون
# نیاز به Rust بالاتر از ۱٫۸۰ (کمینهٔ نسخهٔ این پروژه) انتخاب شده‌اند.
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dehkhoda-core = { path = "../crates/dehkhoda-core" }

[dev-dependencies]
tempfile = "3"
