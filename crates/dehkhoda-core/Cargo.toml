[package]
name = "dehkhoda-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "Offline Dehkhoda dictionary core: Persian normalization, SQLite/FTS5 search, HTML sanitizing, user data"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
ammonia = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
