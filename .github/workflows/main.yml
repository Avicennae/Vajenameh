# ساخت نصب‌کنندهٔ ویندوز روی سرور گیت‌هاب (بدون نصب هیچ چیز روی رایانهٔ خودتان).
# اجرا: صفحهٔ مخزن در گیت‌هاب ← Actions ← «Build Windows installer» ← Run workflow.
# خروجی: در پایین صفحهٔ همان اجرا، بخش Artifacts، فایل «Dehkhoda-windows-installer».
#
# توجه: این فایل را روی ویندوز واقعی نمی‌توانستم اجرا کنم؛ اولین اجرا را خودتان ببینید.
name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ۱) تست‌های ابزارهای پایتون (پارسر، نرمال‌ساز، سازندهٔ دیتابیس)
      - name: Python tests
        run: python -m unittest discover -s tools/tests

      # ۲) دانلود دیتا + ساخت دیتابیس + بررسی (شمارش ردیف‌ها با README مخزن مقایسه می‌شود)
      - name: Build the database
        run: python tools/build_db.py --strict

      # ۳) رابط: نصب، بررسی نوع‌ها، تست، و بیلد (پوستهٔ Tauri برای کامپایل به پوشهٔ dist نیاز دارد)
      - name: Install JS dependencies
        run: npm ci

      - name: UI type-check, tests and build
        run: |
          npm run typecheck
          npm test
          npm run build

      # ۴) تست‌های Rust (هسته و پوسته)
      - name: Rust tests
        run: cargo test -p dehkhoda-core -p dehkhoda-app

      # ۵) نصب‌کننده (NSIS) — خروجی: target/release/bundle/nsis/*.exe
      - name: Build the installer
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: Dehkhoda-windows-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
          compression-level: 0
